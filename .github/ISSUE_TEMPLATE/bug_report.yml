name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where do you run opentopost
      options:
        - Self-hosted
        - opentopost.com
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: For a self-hosted copy, the output of `git rev-parse --short HEAD`.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any keys, tokens, and personal data first.
