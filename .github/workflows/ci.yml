name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Placeholder values so the build can run without a real deployment.
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          KINDE_CLIENT_ID: placeholder
          KINDE_CLIENT_SECRET: placeholder
          KINDE_ISSUER_URL: https://example.kinde.com
          KINDE_SITE_URL: http://localhost:3000
          KINDE_POST_LOGOUT_REDIRECT_URL: http://localhost:3000
          KINDE_POST_LOGIN_REDIRECT_URL: http://localhost:3000/dashboard
      - name: Type check
        run: npx tsc --noEmit
